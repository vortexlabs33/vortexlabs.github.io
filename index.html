    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        .app-container { width: 100%; max-width: 420px; background-color: #0f172a; border: 1px solid #1e293b; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); overflow: hidden; position: relative; }
        .header { background: #0f172a; border-bottom: 1px solid #1e293b; padding: 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .logo { font-weight: 800; font-size: 18px; color: #38bdf8; letter-spacing: 0.5px; }
        .wallet-pill { background: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; color: #38bdf8; border: 1px solid #334155; }
        .content { padding: 16px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 18px; margin-bottom: 16px; }

        .form-input:focus { border-color: #38bdf8; }
        .btn { width: 100%; background: linear-gradient(135deg, #38bdf8, #0284c7); color: #0f172a; font-weight: 800; padding: 14px; border-radius: 12px; border: none; font-size: 15px; cursor: pointer; text-align: center; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }
        .btn:hover { opacity: 0.95; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 420px; margin: 0 auto; background-color: #0f172a; border-top: 1px solid #1e293b; display: flex; justify-content: space-around; padding: 6px 0; z-index: 50; }
        .nav-item { background: none; border: none; color: #94a3b8; display: flex; flex-direction: column; align-items: center; font-size: 8px; cursor: pointer; gap: 2px; }
        .nav-item.active { color: #38bdf8; font-weight: 700; }
        .nav-item i { font-size: 14px; }
        .ad-box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 14px; text-align: center; margin-top: 16px; min-height: 80px; }
        .ad-label { font-size: 9px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; font-weight: 700; }
        .ticker-box { background: #020617; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; font-size: 11px; color: #38bdf8; }
        .warning-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 10px; font-size: 11px; color: #fca5a5; line-height: 1.4; margin-bottom: 14px; }
        .faq-item { border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 10px; }
        .faq-question { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #e2e8f0; cursor: pointer; }
        .faq-answer { font-size: 11px; color: #94a3b8; margin-top: 6px; line-height: 1.5; display: none; }
        .support-btn { background: #0284c7; color: #ffffff; padding: 12px; border-radius: 10px; text-decoration: none; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 8px; }
        .admin-table-container, .tx-table-container { width: 100%; overflow-x: auto; margin-top: 10px; }
        .admin-table, .tx-table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: left; }
        .admin-table th, .admin-table td, .tx-table th, .tx-table td { padding: 8px 10px; border: 1px solid #334155; }
        .admin-table th, .tx-table th { background-color: #020617; color: #38bdf8; text-transform: uppercase; }
        .admin-table td, .tx-table td { color: #cbd5e1; background-color: #0f172a; }

        <!-- Bottom Navigation -->

        </div>

    <script>
        let state = {
            registered: localStorage.getItem('vx_reg') === 'true',
            username: localStorage.getItem('vx_user') || '',
            email: localStorage.getItem('vx_email') || '',
            country: localStorage.getItem('vx_country') || 'Nigeria (₦ NGN)',
            balance: parseFloat(localStorage.getItem('vx_bal') || '0'),
            createdAt: localStorage.getItem('vx_created_at') || new Date().toISOString(),
            lastWithdrawalTime: localStorage.getItem('vx_last_wd') || '',
            lastBonusClaim: localStorage.getItem('vx_bonus_claim') || '',
            lastTaskClaim: localStorage.getItem('vx_task_claim') || '',
            referralsCount: parseInt(localStorage.getItem('vx_refs') || '0'),
            transactions: JSON.parse(localStorage.getItem('vx_tx') || '[]'),
            adminUnlocked: false,
            taskActive: false,
            taskTimer: 300,
            timerInterval: null
        };

        const tickerMessages = [
            "🔥 John Smith (USA) successfully withdrew ₦15,000 via Crypto USDT",
            "⚡ Chidi Okafor (Nigeria) successfully withdrew ₦8,500 via OPay",
            "💰 Amina Bello (Nigeria) successfully withdrew ₦10,000 via Moniepoint",
            "🚀 Oluwaseun Adebayo (Nigeria) successfully withdrew ₦20,000 via GTBank",
            "🌟 David Miller (UK) successfully withdrew ₦12,500 via International Transfer",
            "🔥 Fatima Garba (Nigeria) successfully withdrew ₦7,000 via Palmpay",
            "⚡ Emeka Obi (Nigeria) successfully withdrew ₦9,500 via Kuda Bank"
        ];
        let tickerIndex = 0;

        function updateBalanceDisplay() {
            const el = document.getElementById('header-balance');
            if (el) el.innerText = `₦${state.balance.toLocaleString()}`;
        }

        function generateTxId() {
            return 'TXN-' + Math.floor(100000 + Math.random() * 900000);
        }

        function addTransaction(type, amount, status) {
            const newTx = {
                txId: generateTxId(),
                type: type,
                amount: amount,
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                status: status
            };
            state.transactions.unshift(newTx);
            localStorage.setItem('vx_tx', JSON.stringify(state.transactions));
        }

        function render() {
            const view = document.getElementById('main-view');
            const header = document.getElementById('app-header');
            const nav = document.getElementById('bottom-nav');

            if (!state.registered) {
                header.classList.add('hidden');
                nav.classList.add('hidden');
                view.innerHTML = `
                    <div style="padding: 10px 0;">
                        <div style="text-align: center; margin-bottom: 20px;">
                            <h1 style="font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 6px;">Vortexlabs Portal</h1>
                            <p style="font-size: 12px; color: #94a3b8;">Create your profile to begin earning sustainable daily rewards.</p>
                        </div>
                        <form onsubmit="handleRegister(event)" class="card">
                            <div class="warning-box">
                                <i class="fa-solid fa-triangle-exclamation"></i> <strong>IMPORTANT SECURITY NOTICE:</strong><br>
                                • You are strictly prohibited from opening more than one account.<br>
                                • Multiple accounts or VPN use will result in a <strong>permanent account ban</strong>.<br>
                                • Keep your account on this device! If you log out or try logging in on another phone, your local state won't transfer without cloud sync.
                            </div>

                            <div class="form-group">
                                <label class="form-label">SELECT COUNTRY (CURRENCY AUTO-CONFIG)</label>
                                <select id="reg-country" class="form-input">
                                    <option value="Nigeria (₦ NGN)">Nigeria (₦ NGN)</option>
                                    <option value="Ghana (₵ GHS)">Ghana (₵ GHS)</option>
                                    <option value="Kenya (KSh KES)">Kenya (KSh KES)</option>
                                    <option value="United States ($ USD)">United States ($ USD)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">USERNAME</label>
                                <input type="text" id="reg-user" required placeholder="Enter unique username" class="form-input">
                            </div>
                            <div class="form-group">
                                <label class="form-label">GMAIL ADDRESS</label>
                                <input type="email" id="reg-email" required placeholder="yourname@gmail.com" class="form-input">
                            </div>
                            <div class="form-group">
                                <label class="form-label">PASSWORD</label>
                                <input type="password" id="reg-pass" required placeholder="Create secure password" class="form-input">
                            </div>
                            <div class="form-group">
                                <label class="form-label">SECURITY CHECK: SOLVE 4 + 1</label>
                                <input type="number" id="reg-captcha" required placeholder="Enter answer" class="form-input">
                            </div>
                            <button type="submit" class="btn" style="margin-top: 6px;">Register & Launch Portal</button>
                        </form>
                    </div>
                `;
            } else {
                header.classList.remove('hidden');
                nav.classList.remove('hidden');
                updateBalanceDisplay();
                renderDashboard();
                startTicker();
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const captcha = document.getElementById('reg-captcha').value;
            if (parseInt(captcha) !== 5) {
                alert('Incorrect security check! 4 + 1 = 5.');
                return;
            }
            state.username = document.getElementById('reg-user').value.trim();
            state.email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-pass').value;
            state.country = document.getElementById('reg-country').value;
            state.registered = true;
            state.createdAt = new Date().toISOString();

            localStorage.setItem('vx_reg', 'true');
            localStorage.setItem('vx_user', state.username);
            localStorage.setItem('vx_email', state.email);
            localStorage.setItem('vx_country', state.country);
            localStorage.setItem('vx_created_at', state.createdAt);

            // SAVE LIVE TO FIREBASE CLOUD DATABASE
            const cleanKey = state.username.replace(/[.#$[\]]/g, '_');
            db.ref('users/' + cleanKey).set({
                username: state.username,
                email: state.email,
                password: password,
                country: state.country,
                balance: state.balance,
                tasksCompleted: 0,
                lastActive: new Date().toLocaleDateString()
            });

            render();
        }

        function updateAdminUserStats() {
            if (state.username) {
                const cleanKey = state.username.replace(/[.#$[\]]/g, '_');
                db.ref('users/' + cleanKey).update({
                    balance: state.balance,
                    lastActive: new Date().toLocaleDateString()
                });
            }
        }

        function startTicker() {
            setInterval(() => {
                const tickerEl = document.getElementById('live-ticker-text');
                if (tickerEl) {
                    tickerIndex = (tickerIndex + 1) % tickerMessages.length;
                    tickerEl.innerText = tickerMessages[tickerIndex];
                }
            }, 4000);
        }

        function renderDashboard() {
            const view = document.getElementById('main-view');
            view.innerHTML = `
                <div class="ticker-box">
                    <i class="fa-solid fa-bullhorn" style="font-size: 14px; color: #38bdf8;"></i>
                    <span id="live-ticker-text" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${tickerMessages[0]}</span>
                </div>

                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <h2 style="font-size: 18px; font-weight: 800; color: #fff;">Welcome, ${state.username} 👋</h2>
                        <span style="font-size: 10px; background: #0284c7; color: #fff; padding: 3px 8px; border-radius: 10px; font-weight: 700;">Novice Earner</span>
                    </div>
                    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 14px;">Region: ${state.country}</p>
                    <div style="background: #0f172a; padding: 14px; border-radius: 12px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <span style="font-size: 10px; color: #94a3b8; text-transform: uppercase; display: block;">Total Balance</span>
                            <span style="font-size: 20px; font-weight: 900; color: #38bdf8;">₦${state.balance.toLocaleString()}</span>
                        </div>
                        <button onclick="switchTab('tasks', document.querySelectorAll('.nav-item')[1])" class="btn" style="width: auto; padding: 10px 16px; font-size: 12px;">Earn Now</button>
                    </div>
                </div>

                <div class="card">
                    <h3 style="font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 6px;"><i class="fa-solid fa-gift" style="color: #38bdf8; margin-right: 6px;"></i> Daily Rewards Overview</h3>
                    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 14px;">Daily earnings: ₦400 task + ₦50 bonus = ₦450 max per day.</p>
                    <button onclick="switchTab('bonus', document.querySelectorAll('.nav-item')[2])" class="btn" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155;">View Daily Bonus</button>
                </div>

                <div class="ad-box">
                    <span class="ad-label"><i class="fa-solid fa-rectangle-ad"></i> Sponsored Advertisement</span>
                    <div id="native-ad-container-1"></div>
                </div>
            `;
            loadNativeAd('native-ad-container-1');
        }

        function renderTasks() {
            const view = document.getElementById('main-view');
            const today = new Date().toDateString();
            const alreadyDoneToday = state.lastTaskClaim === today;
            let m = Math.floor(state.taskTimer / 60).toString().padStart(2, '0');
            let s = (state.taskTimer % 60).toString().padStart(2, '0');

            view.innerHTML = `
                <div class="card">
                    <h2 style="font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 6px;"><i class="fa-solid fa-play" style="color: #38bdf8; margin-right: 6px;"></i> Daily 5-Min Task</h2>
                    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 14px;">Stay on this screen for 5 minutes without switching tabs to earn ₦400 (Once per day).</p>
                    
                    <div style="background: #0f172a; padding: 16px; border-radius: 12px; border: 1px solid #334155; text-align: center;">
                        <div id="task-status" style="font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase;">
                            ${alreadyDoneToday ? 'Task Completed Today (Come Back Tomorrow)' : (state.taskActive ? 'Task in Progress... Stay on Page!' : 'Task Ready')}
                        </div>
                        <div id="task-timer-display" style="font-size: 28px; font-weight: 900; color: #38bdf8; margin-bottom: 12px; font-family: monospace;">${m}:${s}</div>
                        <button id="task-btn" onclick="startTaskSession()" class="btn" ${state.taskActive || alreadyDoneToday ? 'style="opacity: 0.5; pointer-events: none;"' : ''}>
                            ${alreadyDoneToday ? 'Completed for Today' : (state.taskActive ? 'Running...' : 'Start 5-Min Task (₦400)')}
                        </button>
                    </div>
                </div>

                <div class="ad-box">
                    <span class="ad-label"><i class="fa-solid fa-rectangle-ad"></i> Sponsored Advertisement</span>
                    <div id="native-ad-container-2"></div>
                </div>
            `;
            loadNativeAd('native-ad-container-2');
        }

        function renderBonusTab() {
            const view = document.getElementById('main-view');
            const today = new Date().toDateString();
            const alreadyClaimed = state.lastBonusClaim === today;

            view.innerHTML = `
                <div class="card" style="text-align: center;">
                    <i class="fa-solid fa-gift" style="font-size: 40px; color: #38bdf8; margin-bottom: 12px; display: block;"></i>
                    <h2 style="font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 6px;">Daily Check-in Bonus</h2>
                    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 16px;">Claim your free ₦50 daily login reward (Capped at ₦50 per day).</p>
                    <button onclick="claimBonus()" class="btn" ${alreadyClaimed ? 'style="opacity: 0.5; pointer-events: none;"' : ''}>
                        ${alreadyClaimed ? 'Bonus Already Claimed Today' : 'Claim ₦50 Daily Bonus'}
                    </button>
                </div>
            `;
        }

        function renderWallet() {
            const view = document.getElementById('main-view');
            
            let txRows = '';
            if (state.transactions.length === 0) {
                txRows = `<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 10px;">No transactions recorded yet.</td></tr>`;
            } else {
                state.transactions.forEach(tx => {
                    let color = tx.status === 'Successful' ? '#10b981' : '#f59e0b';
                    txRows += `
                        <tr>
                            <td><code>${tx.txId}</code></td>
                            <td>${tx.date}</td>
                            <td>${tx.type}</td>
                            <td>₦${tx.amount.toLocaleString()}</td>
                            <td><span style="color: ${color}; font-weight: 700;">${tx.status}</span></td>
                        </tr>
                    `;
                });
            }

            view.innerHTML = `
                <div class="card">
                    <h2 style="font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 4px;"><i class="fa-solid fa-wallet" style="color: #38bdf8; margin-right: 6px;"></i> Wallet & Withdrawals</h2>
                    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 14px;">Min cashout: ₦5,000 | Account must be 30 days old + 30-day cooldown between payouts.</p>
                    
                    <div style="background: #0f172a; padding: 14px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <span style="font-size: 10px; color: #94a3b8; text-transform: uppercase; display: block;">Available Balance</span>
                            <span style="font-size: 20px; font-weight: 900; color: #38bdf8;">₦${state.balance.toLocaleString()}</span>
                        </div>
                        <span style="font-size: 11px; padding: 4px 10px; border-radius: 12px; background: ${state.balance >= 5000 ? '#10b981' : '#ef4444'}; color: #fff; font-weight: 700;">
                            ${state.balance >= 5000 ? 'Eligible' : 'Below Threshold'}
                        </span>
                    </div>

                    <form onsubmit="handleWithdrawal(event)">
                        <div class="form-group">
                            <label class="form-label">SELECT BANK</label>
                            <select id="w-bank" class="form-input" required>
                                <option value="">-- Choose Receiving Bank --</option>
                                <option value="Moniepoint">Moniepoint Microfinance Bank</option>
                                <option value="OPay">OPay Digital Services</option>
                                <option value="Palmpay">Palmpay</option>
                                <option value="Kuda Bank">Kuda Microfinance Bank</option>
                                <option value="GTBank">Guaranty Trust Bank (GTBank)</option>
                                <option value="Access Bank">Access Bank</option>
                                <option value="Zenith Bank">Zenith Bank</option>
                                <option value="First Bank">First Bank of Nigeria</option>
                                <option value="UBA">United Bank for Africa (UBA)</option>
                                <option value="Sterling Bank">Sterling Bank</option>
                                <option value="Wema Bank">Wema Bank (ALAT)</option>
                                <option value="International Bank">International Bank Transfer</option>
                                <option value="Crypto USDT">USDT / Crypto Wallet</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">ACCOUNT NUMBER</label>
                            <input type="number" id="w-account" required placeholder="Enter 10-digit account number" class="form-input">
                        </div>

                        <div class="form-group">
                            <label class="form-label">ACCOUNT HOLDER NAME</label>
                            <input type="text" id="w-name" required placeholder="Enter full account name" class="form-input">
                        </div>

                        <div class="form-group">
                            <label class="form-label">WITHDRAWAL AMOUNT (₦)</label>
                            <input type="number" id="w-amount" required placeholder="Min ₦5,000" min="5000" class="form-input">
                        </div>

                        <button type="submit" class="btn">Submit Withdrawal Request</button>
                    </form>
                </div>

                <div class="card">
                    <h3 style="font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 8px;"><i class="fa-solid fa-clock-rotate-left" style="color: #38bdf8; margin-right: 6px;"></i> Transaction History</h3>
                    <div class="tx-table-container">
                        <table class="tx-table">
                            <thead>
                                <tr>
                                    <th>Ref ID</th>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${txRows}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function handleWithdrawal(e) {
            e.preventDefault();
            const bank = document.getElementById('w-bank').value;
            const account = document.getElementById('w-account').value;
            const name = document.getElementById('w-name').value;
            const amount = parseFloat(document.getElementById('w-amount').value);

            const now = new Date();
            const createdDate = new Date(state.createdAt);
            const accountAgeDays = Math.floor((now - createdDate) / (1000 * 60 * 60 * 24));
            
            if (accountAgeDays < 30) {
                const daysRemaining = 30 - accountAgeDays;
                alert(`Withdrawal Locked! Your account must be at least 30 days old to withdraw.\n\nYour account is currently ${accountAgeDays} day(s) old. Please wait ${daysRemaining} more day(s).`);
                return;
            }

            if (state.lastWithdrawalTime) {
                const lastWdDate = new Date(state.lastWithdrawalTime);
                const daysSinceLastWd = Math.floor((now - lastWdDate) / (1000 * 60 * 60 * 24));
                if (daysSinceLastWd < 30) {
                    const daysRemaining = 30 - daysSinceLastWd;
                    alert(`Withdrawal Cooldown Active!\n\nYou must wait 30 days between withdrawals. Please wait ${daysRemaining} more day(s) before submitting another payout request.`);
                    return;
                }
            }

            if (amount > state.balance) {
                alert(`Insufficient funds! Your available balance is ₦${state.balance.toLocaleString()}.`);
                return;
            }

            if (account.length < 10) {
                alert('Please enter a valid 10-digit account number.');
                return;
            }

            state.balance -= amount;
            state.lastWithdrawalTime = now.toISOString();
            localStorage.setItem('vx_bal', state.balance);
            localStorage.setItem('vx_last_wd', state.lastWithdrawalTime);

            addTransaction(`Withdrawal (${bank})`, amount, 'Pending');
            updateBalanceDisplay();
            updateAdminUserStats();
            alert(`Withdrawal Request Submitted Successfully!\n\nBank: ${bank}\nAccount: ${account}\nName: ${name}\nAmount: ₦${amount.toLocaleString()}\n\nNote: Your next withdrawal is locked for 30 days.`);
            renderWallet();
        }

        function startTaskSession() {
            const today = new Date().toDateString();
            if (state.lastTaskClaim === today) {
                alert('You have already completed today’s task! Come back tomorrow.');
                return;
            }
            if (state.taskActive) return;
            state.taskActive = true;
            state.taskTimer = 300;
            
            const btn = document.getElementById('task-btn');
            const status = document.getElementById('task-status');
            if(btn) { btn.style.opacity = '0.5'; btn.style.pointerEvents = 'none'; btn.innerText = 'Running...'; }
            if(status) { status.innerText = 'Task in Progress... Stay on Page!'; }

            document.addEventListener('visibilitychange', handleVisibilityChange);

            state.timerInterval = setInterval(() => {
                state.taskTimer--;
                const timerEl = document.getElementById('task-timer-display');
                if (timerEl) {
                    let m = Math.floor(state.taskTimer / 60).toString().padStart(2, '0');
                    let s = (state.taskTimer % 60).toString().padStart(2, '0');
                    timerEl.innerText = `${m}:${s}`;
                }

                if (state.taskTimer <= 0) {
                    clearInterval(state.timerInterval);
                    state.taskActive = false;
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    
                    state.balance += 400; // ₦400 task reward
                    state.lastTaskClaim = today;
                    localStorage.setItem('vx_bal', state.balance);
                    localStorage.setItem('vx_task_claim', today);
                    
                    addTransaction('Daily Task Reward', 400, 'Successful');
                    updateBalanceDisplay();
                    updateAdminUserStats();
                    alert('Task completed successfully! ₦400 added to your balance.');
                    state.taskTimer = 300;
                    renderTasks();
                }
            }, 1000);
        }

        function handleVisibilityChange() {
            if (document.hidden && state.taskActive) {
                clearInterval(state.timerInterval);
                state.taskActive = false;
                document.removeEventListener('visibilitychange', handleVisibilityChange);
                state.taskTimer = 300;
                alert('Task failed! You switched tabs or minimized your browser during active verification.');
                renderTasks();
            }
        }

        function claimBonus() {
            const today = new Date().toDateString();
            if (state.lastBonusClaim === today) {
                alert('You have already claimed your daily bonus today! Maximum limit is ₦50 per day. Check back tomorrow.');
                return;
            }
            state.balance += 50; // ₦50 bonus
            state.lastBonusClaim = today;
            localStorage.setItem('vx_bal', state.balance);
            localStorage.setItem('vx_bonus_claim', today);
            
            addTransaction('Daily Check-in Bonus', 50, 'Successful');
            updateBalanceDisplay();
            updateAdminUserStats();
            alert('₦50 Daily Bonus Claimed Successfully!');
            renderDashboard();
        }

        function switchTab(tab, btnEl) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            if (tab === 'dashboard') renderDashboard();
            else if (tab === 'tasks') renderTasks();
            else if (tab === 'bonus') renderBonusTab();
            else if (tab === 'wallet') renderWallet();
            else if (tab === 'referral') renderReferral();
            else if (tab === 'profile') renderProfile();
            else if (tab === 'admin') renderAdminTab();
        }

        window.onload = render;
